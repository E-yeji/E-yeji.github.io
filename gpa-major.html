<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>Major GPA | Eum Yeji</title>
        <!-- Bootstrap CSS & Main CSS -->
        <link rel="stylesheet" href="css/bootstrap.css">
        <link rel="stylesheet" href="css/style.css">
        <style>
            body { background: #f8f9fa; padding: 40px 0; font-family: 'Poppins', sans-serif; }
            .gpa-container { background: #ffffff; border-radius: 16px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 900px; margin: 0 auto; }
            .gpa-header { border-bottom: 2px solid #edf2f7; padding-bottom: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
            .gpa-score { font-size: 32px; font-weight: 700; color: #2b6cb0; }
            .table th { background: #ebf8ff; color: #2b6cb0; font-weight: 600; text-align: center; }
            .table td { text-align: center; vertical-align: middle; }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="gpa-container">
                <div class="gpa-header">
                    <div>
                        <h2 style="font-weight: 700; margin: 0;">Major Academic Transcript</h2>
                        <p style="color: #777; margin: 5px 0 0 0;">주전공(데이터사이언스) 및 복수전공(소프트웨어) 이수 과목</p>
                    </div>
                    <div class="gpa-score">4.19 <span style="font-size: 18px; color: #888;">/ 4.5</span></div>
                </div>

                <!-- 전공 성적 상세 테이블 -->
                <div class="table-responsive">
                    <table class="table table-hover table-bordered">
                        <thead>
                            <tr>
                                <th>전공 구분</th>
                                <th>과목명</th>
                                <th>학점</th>
                                <th>성적</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>데이터사이언스</td>
                                <td>데이터베이스 응용</td>
                                <td>3</td>
                                <td>A+</td>
                            </tr>
                            <tr>
                                <td>소프트웨어</td>
                                <td>운영체제 및 시스템 보안</td>
                                <td>3</td>
                                <td>A+</td>
                            </tr>
                            <!-- 과목 계속 추가 가능 -->
                        </tbody>
                    </table>
                </div>

                <div style="text-align: center; margin-top: 30px;">
                    <button onclick="window.close()" class="btn btn-secondary" style="padding: 10px 25px; border-radius: 8px;">창 닫기</button>
                </div>
            </div>
        </div>
    </body>
</html>
