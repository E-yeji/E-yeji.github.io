title: "E-yeji DB & Security"
subtitle: "Database Administration & Security DevLog"
description: "데이터베이스 관리 및 보안 기술 블로그 & 포트폴리오"
url: "https://E-yeji.github.io"

# Minimal Mistakes 테마 원격 적용
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "default" # 테마 색상 (default, dark, aqua, contract 등)

# 기본 설정
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme

# 프로필 (좌측 사이드바) 설정
author:
  name: "E-yeji"
  avatar: "https://github.com/E-yeji.png" # 깃허브 프로필 이미지 자동 연동
  bio: "Database Management & Security"
  location: "South Korea"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/E-yeji"

# Layout 설정
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true

main_navigation: main
